    <section><h2>新手說明</h2><p>Random 輸出最常用：可以讓同一份材質在套用到不同物體時，各自呈現一點點隨機變化（例如隨機挑選磚塊顏色）。</p></section>
    <section><h2>進階說明</h2><p>需要場景中有多個獨立物體的資訊，本沙盒只預覽單一物體，沒有『物體與物體之間比較』的意義，先列文件。</p></section>
