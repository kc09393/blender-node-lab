    <h1>UV 貼圖</h1>
    <p class="content-lead">指定要用物體身上哪一組 UV 貼圖座標。</p>
    <div class="content-actions">
      <a class="content-primary" href="../sandbox.html?addNode=input_uv_map">在沙盒中試用</a>
      <a href="input_uv_map.en.html">English</a>
    </div>
    <section><h2>新手說明</h2><p>當一個物體有多組 UV（例如一組給貼圖、一組給光照烘焙）時，用這個節點指定要用哪一組。</p></section>
    <section><h2>進階說明</h2><p>本沙盒的預覽物件只有一組內建 UV，因此這個節點固定輸出跟 Texture Coordinate 的 UV 相同的座標。</p></section>
    <section><h2>插槽</h2><table><thead><tr><th>方向</th><th>名稱</th><th>型別</th></tr></thead><tbody><tr><td>OUT</td><td>UV</td><td>vector</td></tr></tbody></table></section>
